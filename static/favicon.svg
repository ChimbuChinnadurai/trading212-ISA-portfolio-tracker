<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background: dark navy rounded square -->
  <rect width="32" height="32" rx="7" fill="#0d1629"/>

  <!-- Candlestick 1 (left, green, medium) -->
  <line x1="8" y1="11" x2="8" y2="14" stroke="#10b981" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="5.5" y="14" width="5" height="9" rx="1" fill="#10b981"/>
  <line x1="8" y1="23" x2="8" y2="26" stroke="#10b981" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Candlestick 2 (middle, red, short) -->
  <line x1="16" y1="9" x2="16" y2="12" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="13.5" y="12" width="5" height="7" rx="1" fill="#ef4444"/>
  <line x1="16" y1="19" x2="16" y2="22" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Candlestick 3 (right, green, tall) -->
  <line x1="24" y1="5" x2="24" y2="8" stroke="#10b981" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="21.5" y="8" width="5" height="12" rx="1" fill="#10b981"/>
  <line x1="24" y1="20" x2="24" y2="24" stroke="#10b981" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Upward trend line -->
  <polyline points="8,19 16,16 24,14"
    fill="none" stroke="#3b82f6" stroke-width="1.5"
    stroke-linecap="round" stroke-linejoin="round"
    opacity="0.85"/>
</svg>
