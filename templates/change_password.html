<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Change Password — Portfolio Tracker</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      background: var(--bg);
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '✦';
      position: fixed;
      top: 10%;
      right: 15%;
      font-size: 40px;
      color: var(--accent-tertiary);
      opacity: 0.15;
      pointer-events: none;
      filter: blur(1px);
    }

    body::after {
      content: '✻';
      position: fixed;
      bottom: 15%;
      left: 10%;
      font-size: 60px;
      color: var(--accent);
      opacity: 0.1;
      pointer-events: none;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      z-index: 10;
      animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .login-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius, 12px);
      padding: 40px 30px;
      box-shadow: var(--shadow-card);
      position: relative;
      overflow: hidden;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .login-card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, var(--accent-tertiary) 0%, var(--accent) 100%);
    }

    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .login-logo {
      width: 50px;
      height: 50px;
      margin: 0 auto 15px auto;
      background: var(--bg-card);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid var(--border);
      box-shadow: var(--shadow);
    }

    .login-logo svg {
      width: 36px;
      height: 36px;
    }

    .login-title {
      font-family: 'PT Serif', serif;
      font-weight: 700;
      font-size: 1.8rem;
      color: var(--text-primary);
      margin-bottom: 5px;
    }

    .login-subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }

    .form-group {
      margin-bottom: 18px;
      position: relative;
    }

    .form-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
    }

    .form-input {
      width: 100%;
      padding: 12px 14px 12px 40px;
      background: var(--bg-row-alt, rgba(0, 0, 0, 0.02));
      border: 1.5px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      border-color: var(--accent);
      background: var(--bg-card);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .input-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
      color: var(--text-muted);
      pointer-events: none;
      transition: color 0.2s;
    }

    .form-input:focus + .input-icon {
      color: var(--accent);
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dim) 100%);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 12px var(--accent-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn-submit:hover {
      filter: brightness(1.08);
      box-shadow: 0 4px 20px var(--accent-glow);
      transform: translateY(-1px);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .error-box {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--red);
      color: var(--red);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.8rem;
      margin-bottom: 20px;
      display: none;
      align-items: center;
      gap: 8px;
      animation: shake 0.4s ease-in-out;
    }

    .info-box {
      background: rgba(123, 97, 255, 0.08);
      border: 1.5px solid var(--accent);
      color: var(--text-primary);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.8rem;
      margin-bottom: 20px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      line-height: 1.4;
    }

    .info-box .info-icon {
      font-size: 20px;
      color: var(--accent);
      flex-shrink: 0;
      margin-top: 1px;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    .btn-logout {
      display: block;
      width: 100%;
      text-align: center;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-decoration: none;
      margin-top: 15px;
      cursor: pointer;
      transition: color 0.2s;
    }

    .btn-logout:hover {
      color: var(--red);
    }

    /* Keyframes */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .shake-animation {
      animation: shake 0.4s ease-in-out;
    }
  </style>
</head>
<body>
  <div class="paper-texture"></div>

  <div class="login-container">
    <div class="login-card" id="changeCard">
      <div class="login-header">
        <div class="login-logo">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
            <rect class="logo-bg" width="32" height="32" rx="7" fill="#0d1629" />
            <line x1="8" y1="11" x2="8" y2="14" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" />
            <rect x="5.5" y="14" width="5" height="9" rx="1" fill="#10b981" />
            <line x1="8" y1="23" x2="8" y2="26" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" />
            <line x1="16" y1="9" x2="16" y2="12" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" />
            <rect x="13.5" y="12" width="5" height="7" rx="1" fill="#ef4444" />
            <line x1="16" y1="19" x2="16" y2="22" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" />
            <line x1="24" y1="5" x2="24" y2="8" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" />
            <rect x="21.5" y="8" width="5" height="12" rx="1" fill="#10b981" />
            <line x1="24" y1="20" x2="24" y2="24" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" />
            <polyline class="logo-accent-blue" points="8,19 16,16 24,14" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
          </svg>
        </div>
        <h1 class="login-title">Change Password</h1>
        <p class="login-subtitle">Secure your account to continue</p>
      </div>

      <div class="info-box">
        <span class="material-symbols-outlined info-icon">shield_lock</span>
        <div>
          <strong>First-time Sign In Detected</strong>
          <div style="margin-top:4px;color:var(--text-secondary)">For security, you must change your default password before accessing your portfolios.</div>
        </div>
      </div>

      <div class="error-box" id="errorBox">
        <span class="material-symbols-outlined" style="font-size:18px">error</span>
        <span id="errorMessage">Invalid inputs</span>
      </div>

      <form id="changePasswordForm" onsubmit="handleChangePassword(event)">
        <div class="form-group">
          <label class="form-label" for="current_password">Current Password</label>
          <div class="input-wrapper">
            <input class="form-input" type="password" id="current_password" name="current_password" required placeholder="Default password (admin)" autofocus />
            <span class="material-symbols-outlined input-icon">lock_open</span>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="new_password">New Password</label>
          <div class="input-wrapper">
            <input class="form-input" type="password" id="new_password" name="new_password" required placeholder="At least 5 characters" />
            <span class="material-symbols-outlined input-icon">lock</span>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm_password">Confirm New Password</label>
          <div class="input-wrapper">
            <input class="form-input" type="password" id="confirm_password" name="confirm_password" required placeholder="Repeat new password" />
            <span class="material-symbols-outlined input-icon">lock</span>
          </div>
        </div>

        <button class="btn-submit" type="submit" id="submitBtn">
          <span class="spinner" id="btnSpinner"></span>
          <span id="btnText">Update Password</span>
        </button>

        <a class="btn-logout" href="/api/auth/logout">Cancel &amp; Sign Out</a>
      </form>
    </div>
  </div>

  <script>
    // Theme sync
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);

    async function handleChangePassword(event) {
      event.preventDefault();
      
      const errorBox = document.getElementById('errorBox');
      const errorMessage = document.getElementById('errorMessage');
      const changeCard = document.getElementById('changeCard');
      const submitBtn = document.getElementById('submitBtn');
      const btnSpinner = document.getElementById('btnSpinner');
      const btnText = document.getElementById('btnText');
      
      const currentPassword = document.getElementById('current_password').value;
      const newPassword = document.getElementById('new_password').value;
      const confirmPassword = document.getElementById('confirm_password').value;

      errorBox.style.display = 'none';
      changeCard.classList.remove('shake-animation');

      // Client-side checks
      if (newPassword !== confirmPassword) {
        showError("New passwords do not match.");
        return;
      }

      if (newPassword.length < 5) {
        showError("New password must be at least 5 characters long.");
        return;
      }

      if (newPassword === 'admin') {
        showError("New password must be different from 'admin'.");
        return;
      }

      // Loading state
      submitBtn.disabled = true;
      btnSpinner.style.display = 'inline-block';
      btnText.textContent = 'Updating...';

      try {
        const response = await fetch('/api/auth/change-password', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify({
            current_password: currentPassword,
            new_password: newPassword,
            confirm_password: confirmPassword
          })
        });

        const result = await response.json();

        if (response.ok && result.status === 'ok') {
          // Success! Redirect to SPA dashboard
          window.location.href = '/';
        } else {
          showError(result.message || 'Failed to update password.');
        }
      } catch (err) {
        showError('Network error. Please try again.');
        console.error(err);
      } finally {
        submitBtn.disabled = false;
        btnSpinner.style.display = 'none';
        btnText.textContent = 'Update Password';
      }

      function showError(msg) {
        errorMessage.textContent = msg;
        errorBox.style.display = 'flex';
        // Trigger reflow to restart animation
        void changeCard.offsetWidth;
        changeCard.classList.add('shake-animation');
      }
    }
  </script>
</body>
</html>
